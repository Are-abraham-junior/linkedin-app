# BLEADIN-API-GUARD BEGIN — ne pas supprimer, ne pas dupliquer
#
# POURQUOI CE BLOC EXISTE
# -----------------------
# L'application Node vit dans ~/public_html/api-bleadin, c'est-a-dire SOUS le
# repertoire qui porte le .htaccess du front (~/public_html/.htaccess). Apache
# lit et applique les .htaccess de TOUS les repertoires parents sur le chemin du
# fichier demande — le vhost api.bleadin.com herite donc du fallback SPA :
#
#     RewriteCond %{REQUEST_FILENAME} !-f
#     RewriteCond %{REQUEST_FILENAME} !-d
#     RewriteRule . /index.html [L]
#
# Consequence : toute URL ne correspondant pas a un fichier ou un dossier reel du
# docroot de l'API (donc /api/health, /api/auth/login, et toutes les routes
# Express) etait reecrite vers un /index.html inexistant ici → 500 Internal
# Server Error cote Apache, alors que le process Node tournait parfaitement.
# Panne constatee le 11/09/2026, API entierement hors service.
#
# COMMENT CE BLOC CORRIGE
# -----------------------
# mod_rewrite ne FUSIONNE pas les configurations par repertoire : des qu'un
# repertoire declare son propre `RewriteEngine On`, les regles du parent ne sont
# plus heritees (sauf `RewriteOptions Inherit` explicite). Un `RewriteEngine On`
# sans aucune regle suffit donc a isoler totalement l'API.
#
# Verifie empiriquement sur web42.lws-hosting.com le 11/09/2026 : un repertoire
# temoin sans ce bloc renvoyait 200 (index.html du SPA) sur une URL inexistante,
# le meme repertoire avec ce bloc renvoyait bien 404.
#
# Cette garde est LOCALE a l'API : elle protege meme si ~/public_html/.htaccess
# regresse un jour (redeploiement du front, edition manuelle, reset cPanel).
<IfModule mod_rewrite.c>
  RewriteEngine On
</IfModule>
# BLEADIN-API-GUARD END
